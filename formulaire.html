<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Project Facture">
    <meta name="description" content="Application de facturation électronique pour les artisants">
    <link rel="icon" href="./assets/logo/favicon.svg" type=image/svg>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/formulaire.css">
    <title>Inscription | Sendly</title>

</head>

<body>
    <main>
        <a href="index.html" class="logo">
            <img src="./assets/logo/logo_texte.svg" alt="logo de l'entreprise">
        </a>
        <section id="form">
            <h1>Crée un compte gratuit</h1>
            <h2>Gratuit pendant 14 jours, sans carte bancaire!</h2>

            <div>
                <form class="form">
                    <button class="btn-connexion google-id" type="button">
                        <img src="./assets/icons/google.svg" alt="icone de google">
                        Crée mon compte avec Google
                    </button>

                    <button class="btn-connexion apple-id" type="button">
                        <img src="./assets/icons/apple.svg" alt="icone de appel">
                        Crée mon compte avec Apple
                    </button>
                    <p class="connexion">Ou</p>

                    <label class="promt2" for="username">Nom d'utilisateur</label>
                    <input class="input-other" type="text" id="username" placeholder="Nom d'utilisateur" name="username"
                        required>

                    <label class="promt2" for="email">Email</label>
                    <input class="input-other" type="email" id="email" placeholder="Email" name="email" required>

                    <label class="promt2" for="password">Mot de passe</label>
                    <input class="input-other" type="password" id="password" placeholder="Mot de passe" name="password"
                        required>
                    <p class="password-min">Veuillez saisir un mot de passe avec <br>8 caractères minimum - 1 caractère
                        spécial - 1 chiffre</p>

                    <label class="promt2" for="password2">Confirmer le mot de passe</label>
                    <input class="input-other" type="password" id="password2" placeholder="Confirmer le mot de passe"
                        name="password2" required>

                    <label class="choice">
                        <input class="conditions" type="checkbox" name="newsletter" checked> Je souhaite recevoir les
                        newsletter de Sendly par email
                    </label>
                    <label class="choice">
                        <input class="conditions" type="checkbox" name="cgu"> J'ai lu et j'accepte <strong><a
                                href="#">les conditions générales.</a></strong>
                    </label>

                    <button class="btn-submit" type="submit">Créer un compte</button>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
